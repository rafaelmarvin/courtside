<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CourtSide - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/global.css">
</head>
<body>
<!-- Navbar -->
<nav class="navbar">
    <div class="navbar-container">
        <div class="logo">
            <a href="../index.html">CourtSide</a>
        </div>
        <ul class="nav-menu">
            <li class="nav-item dropdown">
                <a href="#" class="nav-link">Olahraga <i class="fas fa-chevron-down"></i></a>
                <ul class="dropdown-menu">
                    <li><a href="berita.html">Sepakbola</a></li>
                    <li><a href="berita.html">Basket</a></li>
                </ul>
            </li>
            <li class="nav-item"><a href="/html/berita.html" class="nav-link">Berita</a></li>
            <li class="nav-item"><a href="/html/toko.html" class="nav-link">Toko</a></li>
            <li class="nav-item"><a href="/html/komunitas.html" class="nav-link">Komunitas</a></li>
            <li class="nav-item"><a href="/html/aboutus.html" class="nav-link">About Us</a></li>
        </ul>
        <div class="auth">
            <a href="/html/login.html" class="btn-login">Login</a>
            <a href="/html/register.html" class="btn-register">Register</a>
        </div>
        <div class="hamburger">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
    </div>
</nav>

    <!-- Login Section -->
    <section class="login-section">
        <div class="login-container">
            <div class="login-header">
                <h2>Masukan Akun Anda</h2>
                <p>Belum punya akun? <a href="register.html">Daftar disini</a></p>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Masukkan email" required>
                    <span class="error-message" id="email-error">Email harus valid</span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Masukkan password" required>
                    <span class="error-message" id="password-error">Password minimal 8 karakter</span>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember">
                        <span class="checkmark"></span>
                        Ingat saya
                    </label>
                    <a href="#" class="forgot-password">Lupa password?</a>
                </div>
                
                <a href="/index.html" class="btn-login">Masuk</a>
                
                <div class="divider">
                    <span>atau</span>
                </div>
                
                <div class="social-login">
                    <button type="button" class="btn-social google">
                        <i class="fab fa-google"></i>
                        Masuk dengan Google
                    </button>
                    <button type="button" class="btn-social facebook">
                        <i class="fab fa-facebook-f"></i>
                        Masuk dengan Facebook
                    </button>
                </div>
            </form>
        </div>
    </section>
</body>
</html>
